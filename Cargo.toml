[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "coreicon"
version = "26.1.0"
edition = "2021"
authors = ["arlomu"]
description = "Icon library & generator for TontooOS – SF Symbols with Color, Gradient, Transparency and PNG generation"
license = "TCL"
repository = "https://github.com/TontooOS/CoreIcon"
keywords = ["tontoo", "icons", "sf-symbols", "generator", "png"]
categories = ["gui", "icons", "graphics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
coreimage = { package = "coreimage", path = "../CoreImage" }
archivekit = { package = "archivekit", path = "../ArchiveKit" }
ab_glyph = "0.2"

[dev-dependencies]
